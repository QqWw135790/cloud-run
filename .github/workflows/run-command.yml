name: run-command

"on":
  workflow_dispatch:
    inputs:
      command:
        description: "要执行的命令"
        required: true
        default: "nproc && free -h && df -h /"
      publish_output:
        description: "发布输出到 Git 历史和工作流产物（默认关闭）"
        type: boolean
        default: false
      timeout_minutes:
        description: "超时分钟数(最大350)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      minutes: ${{ steps.timeout.outputs.minutes }}
    steps:
      - name: 检查超时时间
        id: timeout
        env:
          MINUTES: ${{ inputs.timeout_minutes || '20' }}
        run: |
          if [[ ! "$MINUTES" =~ ^[1-9][0-9]{0,2}$ ]] || (( MINUTES > 350 )); then
            echo "超时时间必须是 1 到 350 的整数" >&2
            exit 1
          fi

          echo "minutes=$MINUTES" >> "$GITHUB_OUTPUT"

  run:
    needs: validate
    outputs:
      result-artifact: ${{ steps.save-result.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.validate.outputs.minutes) }}
    steps:
      - name: 机器规格
        run: nproc && free -h && df -h /

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 执行命令
        id: command
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -e -c "$COMMAND" > result.txt 2>&1

      - name: 保存待回写的结果
        id: save-result
        if: ${{ !cancelled() && inputs.publish_output && (steps.command.outcome == 'success' || steps.command.outcome == 'failure') && github.ref_type == 'branch' }}
        uses: actions/upload-artifact@v4
        with:
          name: command-result-${{ github.run_attempt }}
          path: result.txt
          if-no-files-found: error
          retention-days: 1

      - name: 收集产物
        if: ${{ !cancelled() && inputs.publish_output && (steps.command.outcome == 'success' || steps.command.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            *.txt
            *.log
            out/**
            dist/**
          if-no-files-found: ignore
          retention-days: 7

  write-result:
    needs: run
    if: ${{ always() && !cancelled() && (needs.run.result == 'success' || needs.run.result == 'failure') && needs.run.outputs.result-artifact != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.run.outputs.result-artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/command-result

      - name: 回写结果
        run: |
          src="$RUNNER_TEMP/command-result/result.txt"
          test -f "$src" && test ! -L "$src" || exit 1
          cp --remove-destination -- "$src" result.txt
          git add -- result.txt
          if git diff --cached --quiet -- result.txt; then
            exit 0
          fi
          git -c user.name=bot -c user.email=bot@example.com commit -m "result"
          git push origin "HEAD:$GITHUB_REF"
